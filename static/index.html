<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadash - مساعد الأخبار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #0d1b2a 100%);
            border-bottom: 1px solid rgba(99, 160, 255, 0.15);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #63a0ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header .status {
            font-size: 0.75rem;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        header .status::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(99, 160, 255, 0.2);
            border-radius: 3px;
        }

        .message {
            max-width: 75%;
            padding: 14px 20px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: #fff;
            border-bottom-left: 4px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d1d5db;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .message.bot .source-link {
            display: inline-block;
            margin-top: 8px;
            color: #63a0ff;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .message.bot .source-link:hover {
            color: #a78bfa;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .welcome-message h2 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #63a0ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-message p {
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .typing-indicator {
            align-self: flex-start;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: none;
            gap: 6px;
            align-items: center;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #63a0ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .input-area {
            padding: 16px 24px;
            background: linear-gradient(0deg, #0d1b2a 0%, rgba(13, 27, 42, 0.95) 100%);
            border-top: 1px solid rgba(99, 160, 255, 0.1);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }

        .input-wrapper input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid rgba(99, 160, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .input-wrapper input::placeholder {
            color: #4b5563;
        }

        .input-wrapper button {
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s;
            white-space: nowrap;
        }

        .input-wrapper button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .input-wrapper button:active {
            transform: translateY(0);
        }

        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        @media (max-width: 768px) {
            .message { max-width: 90%; }
            header h1 { font-size: 1.2rem; }
            .welcome-message h2 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Kadash - مساعد الأخبار الذكي</h1>
        <div class="status">متصل</div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-message" id="welcomeMessage">
            <h2>مرحباً بك في كَدَش</h2>
            <p>اسألني عن أي خبر أو موضوع وسأبحث لك في أحدث الأخبار من بوابة الأهرام</p>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input
                type="text"
                id="queryInput"
                placeholder="اكتب سؤالك هنا..."
                autocomplete="off"
            />
            <button id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeMessage = document.getElementById('welcomeMessage');

        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });

        function addMessage(text, type) {
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }

            const msg = document.createElement('div');
            msg.classList.add('message', type);
            msg.textContent = text;
            chatContainer.insertBefore(msg, typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            queryInput.disabled = loading;
            typingIndicator.classList.toggle('active', loading);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const query = queryInput.value.trim();
            if (!query) return;

            addMessage(query, 'user');
            queryInput.value = '';
            setLoading(true);

            try {
                const response = await fetch('http://127.0.0.1:8080/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, admin: false })
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage(data.response || data.toString(), 'bot');
                } else {
                    addMessage('حدث خطأ: ' + (data.error || 'خطأ غير معروف'), 'error-message bot');
                }
            } catch (error) {
                addMessage('تعذر الاتصال بالخادم. تأكد من أن الخادم يعمل.', 'error-message bot');
            } finally {
                setLoading(false);
            }
        }
    </script>

</body>
</html>
